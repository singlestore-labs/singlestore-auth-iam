name: Publish Java package to Maven Central

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Lint / formatting check
        run: make lint-java

      - name: Run tests with coverage (mvn verify)
        working-directory: java
        run: mvn -q -DskipTests=false verify

  publish:
    name: Upload release to Maven Central
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21 with Maven Central settings
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build and publish to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USER }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: java
        run: |
          set -euo pipefail
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${RELEASE_VERSION}" ] || ! echo "${RELEASE_VERSION}" | grep -Eq '^[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.-]+)?$'; then
            echo "Invalid release tag ${GITHUB_REF_NAME}; expected vMAJOR[.MINOR[.PATCH]][-qualifier]" >&2
            exit 1
          fi
          mvn -B versions:set -DnewVersion="${RELEASE_VERSION}" -DgenerateBackupPoms=false
          mvn -B clean deploy -DskipTests -Prelease

      # Central rejects a bundle containing anything that is not under a version
      # directory with a .pom — a stray maven-metadata*.xml is the usual culprit, and
      # the plugin only removes the one name it knows. The v0.6.0 attempt failed that
      # validation and the bundle it built could not be recovered afterwards, so keep
      # it when the publish fails.
      - name: Capture deployment bundle on failure
        if: failure()
        working-directory: java
        run: |
          set -euo pipefail
          echo "=== staging tree ==="
          find target/central-staging target/central-publishing -type f | sort
          echo "=== central-bundle.zip ==="
          unzip -l target/central-publishing/central-bundle.zip

      - name: Upload deployment bundle on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: central-bundle
          path: java/target/central-publishing/central-bundle.zip
          if-no-files-found: error
